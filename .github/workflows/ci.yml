name: CI checks

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - '*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install Pandoc and other system requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc make gcc g++ imagemagick

      - name: Set up Python
        uses: actions/setup-python@v5.1.0
        with:
          python-version: 3.12

      - name: Install python packages
        run: |
          python -m pip install --upgrade pip
          pip install pipenv
          pip install cython

      - name: Checkout code
        uses: actions/checkout@v4.2.2
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4.5.0
        with:
          java-version: '21'
          distribution: 'temurin' # Note to self: This IS OpenJDK
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android platform and build tools
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Check build prerequisites
        run: |
          bash check-build-prerequisites.sh

      - name: Restore stable debug keystore (keeps sideloaded updates installable)
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "DEBUG_KEYSTORE_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          fi

      - name: Run gradle build
        run: |
          ./gradlew --no-daemon build -PskipIntegrationTests

      - name: Verify APK is signed with the stored key
        if: env.DEBUG_KEYSTORE_PATH != ''
        run: |
          want=$(keytool -list -keystore "$DEBUG_KEYSTORE_PATH" -storepass android 2>/dev/null \
                 | grep -i 'SHA-256' | sed 's/.*: //' | tr -d ':' | tr 'A-F' 'a-f')
          got=$("$ANDROID_HOME"/build-tools/37.0.0/apksigner verify --print-certs app/build/outputs/apk/debug/app-debug.apk \
                 | grep -i 'SHA-256 digest' | head -1 | sed 's/.*: //')
          echo "stored key: $want"
          echo "apk signer: $got"
          [ -n "$want" ] && [ "$want" = "$got" ]

      - name: Run post-build checks
        run: |
          bash tools/workflows/check-translations.sh

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: babybuddy-debug-apk
          path: app/build/outputs/apk/debug/*.apk
